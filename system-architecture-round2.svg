<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">AgriOptimizer system architecture</title>
  <desc id="description">Five modules show the flow from farmer inputs, through location and data services, crop recommendation, crop economics, and profit optimization to a clear farm plan.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#526174"/>
    </marker>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#123c35"/>
      <stop offset="1" stop-color="#176b56"/>
    </linearGradient>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172a2a; }
      .title { font-size: 42px; font-weight: 700; fill: #fff; }
      .subtitle { font-size: 20px; fill: #d9eee7; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1.3px; fill: #4b675e; }
      .module-title { font-size: 22px; font-weight: 700; }
      .body { font-size: 17px; }
      .detail { font-size: 15px; fill: #526174; }
      .number { font-size: 17px; font-weight: 700; fill: #fff; }
      .card { stroke-width: 2; rx: 20; }
      .arrow { fill: none; stroke: #526174; stroke-width: 3.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f4f7f5"/>
  <path d="M0 0 H1600 V150 H0 Z" fill="url(#header)"/>
  <text x="800" y="68" text-anchor="middle" class="title">AgriOptimizer</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">A data-driven crop plan, tailored to each farmer’s land and budget</text>

  <text x="100" y="205" class="eyebrow">HOW THE SYSTEM WORKS</text>
  <text x="100" y="237" class="detail">Five connected modules turn a location into an actionable crop-profit plan.</text>

  <!-- Single, consistent left-to-right workflow -->
  <rect x="90" y="300" width="250" height="350" class="card" fill="#e5f3ff" stroke="#3b82b8"/>
  <circle cx="125" cy="340" r="21" fill="#2876a8"/>
  <text x="125" y="346" text-anchor="middle" class="number">1</text>
  <text x="115" y="394" class="module-title">Farmer App + API</text>
  <text x="115" y="440" class="body">
    <tspan x="115" dy="0">Location</tspan>
    <tspan x="115" dy="32">Land area</tspan>
    <tspan x="115" dy="32">Available budget</tspan>
    <tspan x="115" dy="32">Optional measured</tspan>
    <tspan x="115" dy="24">soil test</tspan>
  </text>
  <text x="115" y="620" class="detail">React web app • FastAPI</text>

  <path d="M340 475 H376" class="arrow"/>

  <rect x="385" y="300" width="250" height="350" class="card" fill="#e8f4e8" stroke="#5c9565"/>
  <circle cx="420" cy="340" r="21" fill="#4b8455"/>
  <text x="420" y="346" text-anchor="middle" class="number">2</text>
  <text x="410" y="394" class="module-title">Local Data</text>
  <text x="410" y="440" class="body">
    <tspan x="410" dy="0">Resolves the</tspan>
    <tspan x="410" dy="26">farmer’s location</tspan>
    <tspan x="410" dy="40">Collects soil and</tspan>
    <tspan x="410" dy="26">weather information</tspan>
  </text>
  <rect x="410" y="566" width="200" height="52" rx="12" fill="#fff" stroke="#c9ddca"/>
  <text x="510" y="588" text-anchor="middle" class="detail">Open-Meteo • Soil sources</text>
  <text x="510" y="607" text-anchor="middle" class="detail">SHC district summary</text>

  <path d="M635 475 H671" class="arrow"/>

  <rect x="680" y="300" width="250" height="350" class="card" fill="#fff4d9" stroke="#d7a63b"/>
  <circle cx="715" cy="340" r="21" fill="#bd8b24"/>
  <text x="715" y="346" text-anchor="middle" class="number">3</text>
  <text x="705" y="394" class="module-title">Crop Advisor</text>
  <text x="705" y="440" class="body">
    <tspan x="705" dy="0">Uses soil and</tspan>
    <tspan x="705" dy="26">weather conditions</tspan>
    <tspan x="705" dy="42">Ranks the top 3</tspan>
    <tspan x="705" dy="26">suitable crops</tspan>
  </text>
  <text x="705" y="620" class="detail">Random Forest classifier</text>

  <path d="M930 475 H966" class="arrow"/>

  <rect x="975" y="300" width="250" height="350" class="card" fill="#f0eaff" stroke="#8d73bd"/>
  <circle cx="1010" cy="340" r="21" fill="#7655a9"/>
  <text x="1010" y="346" text-anchor="middle" class="number">4</text>
  <text x="1000" y="394" class="module-title">Crop Economics</text>
  <text x="1000" y="440" class="body">
    <tspan x="1000" dy="0">Estimates yield</tspan>
    <tspan x="1000" dy="26">from crop history</tspan>
    <tspan x="1000" dy="42">Finds each crop’s</tspan>
    <tspan x="1000" dy="26">best available price</tspan>
  </text>
  <rect x="1000" y="566" width="200" height="52" rx="12" fill="#fff" stroke="#d9d0e8"/>
  <text x="1100" y="588" text-anchor="middle" class="detail">Yield lookup • TGK / CEDA</text>
  <text x="1100" y="607" text-anchor="middle" class="detail">Labelled mock fallback</text>

  <path d="M1225 475 H1261" class="arrow"/>

  <rect x="1270" y="300" width="250" height="350" class="card" fill="#dff4ed" stroke="#46a181"/>
  <circle cx="1305" cy="340" r="21" fill="#268061"/>
  <text x="1305" y="346" text-anchor="middle" class="number">5</text>
  <text x="1295" y="394" class="module-title">Profit Planner</text>
  <text x="1295" y="440" class="body">
    <tspan x="1295" dy="0">Balances farmer’s</tspan>
    <tspan x="1295" dy="26">land and budget</tspan>
    <tspan x="1295" dy="42">Finds a profitable</tspan>
    <tspan x="1295" dy="26">crop allocation</tspan>
  </text>
  <text x="1295" y="620" class="detail">Linear programming optimizer</text>

  <!-- One concise note conveys prototype data limitations -->
  <rect x="180" y="730" width="1240" height="150" rx="22" fill="#fff" stroke="#d8e2dc" stroke-width="2"/>
  <text x="220" y="773" class="eyebrow">CLEAR, TRANSPARENT OUTPUT</text>
  <text x="220" y="814" class="body">The farmer sees recommended crops, expected yield, estimated profit and the final allocation.</text>
  <rect x="220" y="835" width="1160" height="30" rx="15" fill="#fff4d9"/>
  <text x="800" y="856" text-anchor="middle" class="detail">Data transparency: CEDA prices are historical; TGK is not enabled until units are verified; mock and proxy inputs are labelled.</text>

  <text x="800" y="940" text-anchor="middle" class="detail">Farmer inputs → local evidence → crop advice → crop economics → optimized plan</text>
</svg>
